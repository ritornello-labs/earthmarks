<section class="places" data-side="SIDE">
  <div class="place-data" hidden><span data-field="coords">{{Coordinates}}</span><span data-field="tolerance">{{Tolerance km}}</span></div>
  <header><div><div class="eyebrow">{{#Type}}{{Type}}{{/Type}}{{^Type}}Place{{/Type}} <span> / LOCATE</span></div><h1>{{Name}}</h1><p class="context">{{Context}}</p></div><button data-action="settings" aria-label="Settings" title="Settings">⚙</button></header>
  <div class="globe-wrap"><div class="globe" aria-label="Satellite globe" tabindex="0"></div><div class="map-status" role="status">Loading satellite imagery…</div><div class="center-cross" aria-hidden="true">+</div><div class="result" aria-live="polite"></div></div>
  <nav class="toolbar" aria-label="Globe controls"><button data-action="in" aria-label="Zoom in">＋</button><button data-action="out" aria-label="Zoom out">−</button><button data-action="world">World</button><button data-action="pin" title="Place pin at centre">⌖ Pin</button><button data-action="clear">Clear</button><button data-action="fullscreen" aria-label="Fullscreen">⛶</button></nav>
  <aside class="settings" hidden><div class="settings-head"><h2>Make it yours</h2><button data-action="settings" aria-label="Close settings">✕</button></div><label>Country borders <input type="checkbox" data-pref="borders"></label><label>Default tolerance <span><input type="number" min="0.01" max="20000" step="any" data-pref="tolerance"> km</span></label><p class="settings-help">A note’s Tolerance km overrides this default.</p><label>Images <select data-pref="gallery"><option value="carousel">Carousel</option><option value="stack">Image stack</option></select></label><label>Wikipedia <select data-pref="wiki"><option value="embed">Embedded article</option><option value="link">Link only</option></select></label><label>Reduced motion <input type="checkbox" data-pref="motion"></label><p class="settings-help">Saved on this device.</p></aside>
  BACK_CONTENT
</section>
